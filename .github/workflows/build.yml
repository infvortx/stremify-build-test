name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-package:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Nitro build
        run: pnpm run build

      - name: Package as SEA
        run: |
          node --experimental-sea-config sea-config.json
          cp "$(command -v node)" sea-binary
          npx postject sea-binary NODE_SEA_BLOB app.sea --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --macho-segment-name NODE_SEA
          chmod +x sea-binary
          mv sea-binary ./stremify-macos

      - name: Upload artifact for macOS
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-x64
          path: ./stremify-macos
